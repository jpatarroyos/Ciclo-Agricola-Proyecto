<div id="{{ modal_id }}" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
    
    <!-- Encabezado con la X que automatizamos -->
    <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-900">{{ modal_titulo }}</h2>
        <button type="button" onclick="document.getElementById('{{ modal_id }}').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-xl cursor-pointer">✕</button>
    </div>
    
    <form method="post" class="p-6 space-y-4" {{ modal_attrs }}>
      {% csrf_token %}

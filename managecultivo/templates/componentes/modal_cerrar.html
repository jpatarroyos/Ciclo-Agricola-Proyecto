      <!-- Botones estandarizados inferiores -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
          <button type="button" onclick="document.getElementById('{{ modal_id }}').classList.add('hidden')" 
                  class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-4 py-2 rounded-lg text-sm transition-colors cursor-pointer">
            Cancelar
          </button>
          
          <!-- El botón ahora adapta su color y texto de forma dinámica -->
          <button type="submit" name="{{ submit_name }}" 
                  class="{% if boton_clase %}{{ boton_clase }}{% else %}bg-[var(--primary)] hover:bg-[var(--focus)] text-[var(--secondary)]{% endif %} font-medium px-4 py-2 rounded-lg text-sm transition-colors cursor-pointer">
            {% if boton_texto %}{{ boton_texto }}{% else %}Guardar{% endif %}
          </button>
      </div>
    </form>
  </div>
</div>
